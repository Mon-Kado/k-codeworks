<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>STRENGTH village render test</title>
    <style>
      html,
      body {
        margin: 0;
      }
      iframe {
        width: 1600px;
        height: 1800px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <output id="result" data-result="WAIT">WAIT</output>
    <iframe id="page" title="KADOMARU top page"></iframe>
    <script>
      const result = document.querySelector("#result");
      const frame = document.querySelector("#page");
      const params = new URLSearchParams(location.search);
      frame.src =
        params.get("page") || new URL("../index.html", location.href).href;

      frame.addEventListener("load", async () => {
        try {
          const doc = frame.contentDocument;
          const image = doc.querySelector(".strength-village img");
          image.loading = "eager";
          image.scrollIntoView();
          await image.decode();

          const icons = [
            ...doc.querySelectorAll(".strength-point-icon img"),
          ];
          icons.forEach((icon) => {
            icon.loading = "eager";
          });
          icons[0]?.scrollIntoView();
          await Promise.all(icons.map((icon) => icon.decode()));

          const rect = image.getBoundingClientRect();
          const naturalAspect = image.naturalWidth / image.naturalHeight;
          const renderedAspect = rect.width / rect.height;
          const iconRects = icons.map((icon) => icon.getBoundingClientRect());
          const checks = {
            fullPanoramaVisible:
              naturalAspect >= 2.5 &&
              Math.abs(naturalAspect - renderedAspect) < 0.08,
            customIconsLoaded:
              icons.length === 3 &&
              icons.every(
                (icon) =>
                  icon.complete &&
                  icon.naturalWidth === 1254 &&
                  icon.naturalHeight === 1254,
              ),
            customIconsFit:
              iconRects.length === 3 &&
              iconRects.every(
                (iconRect) => iconRect.width === 84 && iconRect.height === 84,
              ),
          };
          const passed = Object.values(checks).every(Boolean);
          result.dataset.result = passed ? "PASS" : "FAIL";
          result.textContent = JSON.stringify({
            checks,
            naturalSize: [image.naturalWidth, image.naturalHeight],
            renderedSize: [Math.round(rect.width), Math.round(rect.height)],
            iconCount: icons.length,
            iconSize: iconRects[0]
              ? [Math.round(iconRects[0].width), Math.round(iconRects[0].height)]
              : null,
          });
        } catch (error) {
          result.dataset.result = "ERROR";
          result.textContent = String(error);
        }
      });
    </script>
  </body>
</html>
